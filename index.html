<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pixel-art multi-title esports organization manager: tactical shooters, MOBAs, battle royales, fighting games, hero shooters and car soccer.">
<meta name="theme-color" content="#0b0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Esports">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<title>Pixel Esports Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b0e1a'/%3E%3Crect x='3' y='2' width='10' height='2' fill='%23ffd166'/%3E%3Crect x='4' y='4' width='8' height='4' fill='%23ffd166'/%3E%3Crect x='6' y='8' width='4' height='3' fill='%23ffd166'/%3E%3Crect x='4' y='11' width='8' height='2' fill='%234ae8a6'/%3E%3Crect x='1' y='3' width='2' height='3' fill='%23ffd166'/%3E%3Crect x='13' y='3' width='2' height='3' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
<link rel="stylesheet" href="styles/pixel-ui.css">
<link rel="stylesheet" href="styles/mobile.css">
</head>
<body>
<div id="app">
<header id="topbar" aria-label="Organization status"></header>
<nav id="sidenav" aria-label="Main navigation"></nav>
<main id="main" aria-live="polite">
<section class="title-screen">
<h1 class="logo">PIXEL <span>ESPORTS</span> MANAGER</h1>
<p class="tagline" id="boot-msg">Loading…</p>
</section>
</main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="assertive"></div>
<noscript><p style="padding:20px">Pixel Esports Manager needs JavaScript enabled.</p></noscript>
<script>
window.addEventListener('error', function (e) {
var m = document.getElementById('boot-msg');
if (m && /Loading/.test(m.textContent)) m.textContent = 'Failed to start: ' + (e.message || 'module error') + ' — check the console.';
});
</script>
<script type="module" src="core/ui.js"></script>
</body>
</html>
